apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: {{ .Values.svc_netflix.labels.app }}
  ports:
    - protocol: TCP
      port: {{ .Values.svc-netflix.port }}        # Service Port
      targetPort: {{ .Values.svc-netflix.targetPort }}   # Container Port
  type: {{ .Values.svc-netflix.type }}